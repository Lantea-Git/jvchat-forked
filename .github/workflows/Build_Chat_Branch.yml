name: Push commit
# .github/workflows/Build_Chat_Branch.yml

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Nom commit'
        required: false
        default: 'push'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync to fork-of-fork and debug
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          cp .github/workflows/Build_Chat_Compile.py /tmp/compile_chat.py
          cp .github/workflows/Build_Chat_Compile_TEST.py /tmp/compile_chat_test.py 2>/dev/null || true

          for branch in fork-of-fork debug; do
            git checkout $branch

            curl -L "https://update.greasyfork.org/scripts/471322.user.js" -o raw.user.js
            python3 /tmp/compile_chat.py raw.user.js JVChat_Premium.user.js
            rm raw.user.js

            git add JVChat_Premium.user.js
            git commit -m "${{ github.event.inputs.commit_message }}" || echo "Rien à committer sur $branch"
            git push origin $branch
          done

          #BRANCHE Test
          [ -f /tmp/compile_chat_test.py ] || exit 0

          test_branch=test-version

          git show-ref --verify --quiet refs/remotes/origin/$test_branch || git checkout -b $test_branch fork-of-fork
          git checkout $test_branch

          curl -L "https://update.greasyfork.org/scripts/471322.user.js" -o raw.user.js
          python3 /tmp/compile_chat_test.py raw.user.js JVChat_Premium.user.js
          rm raw.user.js

          git add JVChat_Premium.user.js
          git commit -m "${{ github.event.inputs.commit_message }}" || echo "Rien à committer sur $test_branch"
          git push origin $test_branch
